schemaVersion = 1

[plugin]
id = "eos.meeting-notes"
publisher = "eos"
name = "EOS 会议纪要"
version = "1.0.0"
description = "把会议记录整理为摘要、已确认决策、行动项和待确认事项，保留负责人、日期与原文依据，不编造结论。Meeting notes and action items."
license = "EOS-NCL-1.1"
homepage = "https://plugins.eosaios.com/plugins/eos.meeting-notes"
repository = "https://github.com/eosaios/eos-plugins"

[compatibility]
platformApi = "^1.0.0"
scope = "portable"

[[modules]]
id = "meeting-notes"
type = "skills/v1"
required = true
entry = "skills"
activation = "on-demand"
requires = [{ capability = "eos.ai.skills", version = "^1.0.0" }]
permissions = []
